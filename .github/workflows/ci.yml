name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            **/*.md

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON examples
        run: |
          for f in examples/*.json; do
            echo "Validating $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

  check-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP endpoint
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" https://mcp.poeditor.com/mcp | grep -E "200|400|405"
